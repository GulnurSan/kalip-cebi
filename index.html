<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d7262d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kalıp Cebi">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Kalıp Cebi</title>
<style>
/* VOICE: warm pocket coach; short Turkish lines, English large
   IDEA: a pocket phrasebook with a Croatian checkerboard edge (Erasmus in Osijek)
   PICTURE: the flashcard itself, big and centred
   COLOUR and TYPE: white ground, Croatian red, ink, blue for "learning", green for "learnt"; system font (works offline)
   LAYOUT: single phone column, bottom tab bar, full-screen study sessions */
:root{--bg:#fff;--ink:#1b1b26;--soft:#5d5d6b;--card:#f5f4f1;--line:#e7e4de;--red:#d7262d;--redbg:#fdeceb;--blue:#1f4fa8;--bluebg:#e9effa;--green:#1d7a46;--greenbg:#e5f4ea;--on-red:#fff;--hero:#d7262d}
@media (prefers-color-scheme:dark){:root{--bg:#15151c;--ink:#f2f0eb;--soft:#a9a8b3;--card:#1f1f29;--line:#30303c;--red:#ff5b52;--redbg:#2a1719;--blue:#8fb2ff;--bluebg:#1b2336;--green:#5fd08f;--greenbg:#16281e;--on-red:#fff;--hero:#a91d23}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#view{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.checks{height:12px;background-image:linear-gradient(45deg,var(--red) 25%,transparent 25%,transparent 75%,var(--red) 75%),linear-gradient(45deg,var(--red) 25%,transparent 25%,transparent 75%,var(--red) 75%);background-size:12px 12px;background-position:0 0,6px 6px;background-color:var(--bg)}
.hero{background:var(--hero);color:var(--on-red);margin:0 -16px;padding:calc(18px + env(safe-area-inset-top)) 20px 20px}
.hero h1{margin:0;font-size:32px;line-height:1.05;letter-spacing:-.5px}
.hero p{margin:6px 0 0;opacity:.95}
.stat-row{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.1}
.stat span{font-size:13px;opacity:.95}
.top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 0 6px}
.top h1{font-size:26px;margin:0;line-height:1.1;flex:1}
.back{border:0;background:var(--card);border-radius:12px;min-width:44px;height:44px;font-size:20px;cursor:pointer}
h2{font-size:20px;margin:24px 0 10px;line-height:1.15}
.muted{color:var(--soft)}
.small{font-size:14px}
.box{background:var(--card);border-radius:16px;padding:16px;margin-top:14px}
.box h3{margin:0 0 4px;font-size:18px}
.box p{margin:0 0 12px}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:14px;background:var(--red);color:var(--on-red);font-size:17px;font-weight:600;cursor:pointer;padding:0 16px}
.btn.alt{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45}
.btn+.btn{margin-top:10px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--green)}.bar .l{background:var(--blue)}
.lvl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.badge{flex:none;width:46px;height:46px;border-radius:12px;background:var(--red);color:var(--on-red);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.lvl .mid{flex:1}
.lvl .mid b{display:block}
.lvl .mid .bar{margin:6px 0 4px}
.unit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.unit .num{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700}
.unit.done .num{background:var(--green);border-color:var(--green);color:var(--bg)}
.unit.part .num{border-color:var(--blue);color:var(--blue)}
.unit .mid{flex:1}
.unit .prev{font-size:14px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:14px;font-size:13px;color:var(--soft);margin-top:6px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;background:var(--line)}
.dot.k{background:var(--green)}.dot.l{background:var(--blue)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:15px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search],textarea,select{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);-webkit-appearance:none;appearance:none}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .mid{flex:1}
.row .en{font-weight:600;font-size:17px}
.row .tr{color:var(--soft);font-size:15px}
.row .ex{color:var(--blue);font-size:14px;margin-top:2px}
.spk{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.spk svg{width:22px;height:22px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--soft);margin-left:6px;vertical-align:middle;font-weight:500}
details.box summary{font-weight:600;font-size:17px;cursor:pointer;list-style:none}
details.box summary::-webkit-details-marker{display:none}
details.box summary::after{content:"+";float:right;font-size:22px;line-height:1}
details[open].box summary::after{content:"–"}
ol.steps{margin:12px 0 0;padding-left:20px}ol.steps li{margin-bottom:8px}
.set{padding:14px 0;border-bottom:1px solid var(--line)}
.set label{display:block;font-weight:600;margin-bottom:8px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-size:15px}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
#tabs button{flex:1;max-width:140px;border:0;background:none;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--soft);cursor:pointer;min-height:54px}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--red);font-weight:600}
/* session */
#session{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sess{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.sess-top{display:flex;align-items:center;gap:10px}
.sess-top .bar{flex:1}
.sess-top .cnt{font-size:14px;color:var(--soft);min-width:52px;text-align:right}
.x{border:0;background:var(--card);border-radius:12px;width:44px;height:44px;font-size:22px;cursor:pointer}
.card{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:20px 4px}
.card .kind{font-size:13px;color:var(--soft);margin-bottom:10px}
.card .big{font-size:32px;line-height:1.15;font-weight:700;word-wrap:break-word}
.card .big.tr{color:var(--ink)}
.card .ans{margin-top:22px;padding-top:20px;border-top:2px dashed var(--line)}
.card .ans .mean{font-size:22px;font-weight:600}
.card .ex{margin-top:14px;color:var(--blue);font-size:17px}
.card .say{margin-top:14px;font-size:15px;color:var(--soft)}
.card .spk{margin:16px auto 0;width:56px;height:56px;border-radius:50%}
.grades{display:flex;gap:8px}
.grades button{flex:1;min-height:58px;border:0;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;line-height:1.1}
.grades small{display:block;font-weight:400;font-size:12px;opacity:.85;margin-top:3px}
.g-again{background:var(--redbg);color:var(--red)}
.g-hard{background:var(--bluebg);color:var(--blue)}
.g-good{background:var(--greenbg);color:var(--green)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-size:17px;padding:10px 14px;cursor:pointer;text-align:left}
.opt.right{border-color:var(--green);background:var(--greenbg)}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
.end{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.end .score{font-size:64px;font-weight:800;line-height:1;color:var(--red)}
.end h2{font-size:26px}
/* sheet */
#sheet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85%;overflow-y:auto}
.sheet h3{margin:0 0 4px;font-size:21px}
.sheet p{margin:0 0 16px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
.empty{text-align:center;color:var(--soft);padding:30px 0}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main id="view"></main>
<nav id="tabs">
<button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Bugün</button>
<button data-tab="levels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/><path d="m2 17.5 10 5 10-5"/></svg>Seviyeler</button>
<button data-tab="dict"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Sözlük</button>
<button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ayarlar</button>
</nav>
<div id="session" hidden></div>
<div id="sheet" hidden></div>
<div id="toast" role="status"></div>
<script>var LEVELS=[];</script>
<script src="data/a1.js"></script>
<script src="data/a2.js"></script>
<script src="data/b1.js"></script>
<script src="data/b2.js"></script>
<script src="data/c1.js"></script>
<script src="data/c2.js"></script>
<script src="app.js"></script>
</body>
</html>
